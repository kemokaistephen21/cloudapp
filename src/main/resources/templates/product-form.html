<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>

    <!-- Bootstrap provides the basic page styling. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
    <div class="container mt-5">

        <!-- This heading tells the user what the form is for. -->
        <h1 class="mb-4">Product Information</h1>

        <!-- This form saves a new product or updates an existing product. -->
        <form action="/products/save" method="post" th:object="${product}">
			
	<!-- This keeps the product ID when editing an existing product. (I made this because it was duplicating the product instead of replacing it)-->
		<input type="hidden" th:field="*{id}">

            <!-- This field stores the product name. -->
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <!-- This field stores the product description. -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" th:field="*{description}" class="form-control" required>
            </div>

            <!-- This field stores the product price. -->
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" th:field="*{price}" class="form-control"
                       step="0.01" min="0" required>
            </div>

            <!-- This field stores the product quantity. -->
            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" th:field="*{quantity}" class="form-control"
                       min="0" required>
            </div>

            <!-- This button saves the product. -->
            <button type="submit" class="btn btn-primary">Save Product</button>

            <!-- This link returns to the product list. -->
            <a href="/products" class="btn btn-secondary">Cancel</a>

        </form>
    </div>
</body>
</html>
