<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    
    <!-- Bootstrap provides the basic page styling. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>

<body>
    <div class="container mt-5">

        <!-- This heading identifies the product page. -->
        <h1 class="mb-4">Product List</h1>

        <!-- This button opens the form to add a new product. -->
        <a href="/products/new" class="btn btn-primary mb-3">Add Product</a>

        <!-- This table displays the products stored in the database. -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <!-- This repeats a row for each product in the database. -->
                <tr th:each="product : ${products}">
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.description}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.quantity}"></td>

                    <td>
                        <!-- This button opens the edit form for the product. -->
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" 
                           class="btn btn-warning btn-sm">Edit</a>

                        <!-- This button deletes the product. -->
                        <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                           class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
